name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check

      # Runs the full suite once per timezone (UTC, Asia/Kathmandu, ...).
      - run: bun run test:timezones

      - run: bun run build
      - run: bun run check:package

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  node:
    # The built package, in plain Node, on current LTS releases.
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        tz: [UTC, Asia/Kathmandu, America/Los_Angeles]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - run: npm run test:smoke
        env:
          TZ: ${{ matrix.tz }}

  go-fixtures:
    # Checks that the committed data and fixtures really are what the pinned,
    # published go-bs version produces.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go-reference/go.mod
          cache-dependency-path: tools/go-reference/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - run: go run . -root ../..
        working-directory: tools/go-reference

      - run: bun run generate

      - run: git diff --exit-code
